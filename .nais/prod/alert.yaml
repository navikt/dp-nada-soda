apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: soda-job-alerts
  namespace: nada
  labels:
    team: nada
spec:
  groups:
  - name: soda-job-alert
    rules:
    - alert: NaisjobDown
      expr: |
        (kube_job_failed{namespace="nada", condition="true"} == 1)
        and on (namespace, job_name)
        kube_job_owner{namespace="nada", owner_kind="CronJob", owner_name="soda-contracts", owner_is_controller="true"}
      for: 2m
      annotations:
        consequence: Naisjobben soda-contracts feiler i prod-gcp:nada. Det kan skyldes en feil i imaget https://github.com/navikt/nada-soda eller tjenesten https://github.com/navikt/nada-soda-service.
        action: "Sjekk logger i Grafana på https://grafana.nav.cloud.nais.io/ med datakilden prod-gcp-loki."
        summary: |-
           Naisjobben soda-contracts feiler i `prod-gcp:nada`.
           Feilen kan skyldes en feil i imaget (https://github.com/navikt/nada-soda) eller tjenesten (https://github.com/navikt/nada-soda-service).
           Repo: https://github.com/navikt/dp-nada-soda
      labels:
        namespace: nada
        severity: critical
